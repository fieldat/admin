<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单词拳皇 · WORD FIGHTER KING</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#06050a;
  }

  /* 整图铺满背景 */
  .cover{
    position:fixed;inset:0;
    background:url("assets/cover-login.jpg") center center / cover no-repeat;
    animation:slowZoom 26s ease-in-out infinite alternate;
    transform-origin:50% 45%;
  }
  @keyframes slowZoom{
    from{transform:scale(1)}
    to{transform:scale(1.045)}
  }

  /* 压暗层：底部渐隐 + 四角暗角，保证按钮可读 */
  .shade{
    position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(120% 85% at 50% 44%, transparent 42%, rgba(0,0,0,.42) 100%),
      linear-gradient(to top,
        rgba(3,3,7,.88) 0%,
        rgba(3,3,7,.62) 12%,
        rgba(3,3,7,.26) 26%,
        transparent 46%);
  }

  /* 唯一的按钮：金属护甲火焰紫电边框做底图 */
  .start{
    position:fixed;left:50%;bottom:6vh;
    transform:translateX(-50%);
    display:flex;align-items:center;justify-content:center;
    width:58vw;max-width:760px;
    aspect-ratio:1400/525;
    background:url("assets/btn-frame.webp") center center / contain no-repeat;
    text-decoration:none;white-space:nowrap;
    font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;
    font-weight:900;font-size:clamp(20px,3.4vw,48px);line-height:1;
    letter-spacing:.3em;text-indent:.3em;
    color:#fff5dd;
    text-shadow:
      0 2px 4px rgba(0,0,0,.95),
      0 0 14px rgba(0,0,0,.9),
      0 0 26px rgba(255,150,60,.75);
    filter:drop-shadow(0 16px 30px rgba(0,0,0,.6));
    transition:filter .2s ease,transform .16s ease;
    animation:breathe 3s ease-in-out infinite;
    -webkit-tap-highlight-color:transparent;
  }
  @keyframes breathe{
    0%,100%{filter:drop-shadow(0 16px 28px rgba(0,0,0,.55)) brightness(1)}
    50%{filter:drop-shadow(0 16px 40px rgba(255,120,40,.5)) brightness(1.09)}
  }
  .start:hover{
    transform:translateX(-50%) scale(1.04);
    filter:drop-shadow(0 18px 44px rgba(255,120,40,.6)) brightness(1.14);
    animation:none;
  }
  .start:active{
    transform:translateX(-50%) scale(.98);
    filter:brightness(.96);
    animation:none;
  }

  /* 窄屏 / 竖屏 */
  @media (max-aspect-ratio: 3/4){
    .start{bottom:10vh;width:86vw;font-size:clamp(18px,5.4vw,34px);letter-spacing:.2em;text-indent:.2em}
  }
  @media (max-height:560px){
    .start{bottom:5vh;width:min(52vw,520px)}
  }
</style>
</head>
<body>

<div class="cover" role="img" aria-label="红方火焰拳皇与蓝方雷电拳皇在螺旋能量中正面对撞"></div>
<div class="shade"></div>

<a class="start" href="select.html">开始对战</a>

</body>
</html>
