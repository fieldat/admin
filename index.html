<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在野 · 小工具集</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2322273A'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%237C8CFF' stroke-width='5'/%3E%3Ccircle cx='32' cy='16' r='4' fill='%23FFB454'/%3E%3C/svg%3E">
<style>
/* ===== 基础 ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Helvetica Neue", sans-serif;
  color: #EDF0F7;
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(1100px 640px at 82% -10%, rgba(124,140,255,.22), transparent 62%),
    radial-gradient(900px 560px at -8% 108%, rgba(255,84,150,.16), transparent 60%),
    linear-gradient(160deg, #141824 0%, #1b2138 55%, #10131f 100%);
  -webkit-font-smoothing: antialiased;
}

/* ===== 顶栏 ===== */
.top {
  padding: 18px 24px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.top .mark {
  width: 34px; height: 34px; border-radius: 10px;
  background: linear-gradient(135deg, #7C8CFF, #FF5496);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 17px; font-weight: 700; letter-spacing: .5px;
  box-shadow: 0 4px 14px rgba(124,140,255,.35);
}
.top .name { font-size: 15px; color: rgba(237,240,247,.85); letter-spacing: 2px; }

/* ===== 主区 ===== */
main {
  flex: 1;
  max-width: 880px;
  width: 100%;
  margin: 0 auto;
  padding: 48px 24px 40px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.hero { margin-bottom: 40px; text-align: center; }
.hero h1 {
  font-size: 34px; font-weight: 800; letter-spacing: 1px;
  background: linear-gradient(100deg, #FFFFFF 10%, #AAB6FF 55%, #FF9DC7 90%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero p { margin-top: 10px; color: rgba(237,240,247,.62); font-size: 15px; letter-spacing: 1px; }

/* ===== 卡片网格 =====
   后续新页面：在此 <div class="grid"> 内再追加一张 <a class="card"> 即可 */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 22px;
}
.card {
  position: relative;
  display: flex; flex-direction: column;
  padding: 26px 24px 22px;
  border-radius: 18px;
  text-decoration: none; color: inherit;
  background: rgba(255,255,255,.045);
  border: 1px solid rgba(255,255,255,.12);
  overflow: hidden;
  transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
}
.card::before {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(420px 220px at 88% -20%, var(--glow), transparent 68%);
  opacity: .9;
  pointer-events: none;
}
.card:hover {
  transform: translateY(-4px);
  border-color: var(--line);
  box-shadow: 0 14px 34px rgba(0,0,0,.35), 0 0 0 1px var(--line) inset;
}
.card .icon {
  width: 52px; height: 52px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 16px;
  background: var(--tile);
  box-shadow: 0 6px 18px rgba(0,0,0,.28);
}
.card .icon svg { width: 28px; height: 28px; }
.card h2 { font-size: 21px; font-weight: 700; letter-spacing: .5px; }
.card .desc { margin-top: 6px; font-size: 13.5px; color: rgba(237,240,247,.6); }
.card .go {
  margin-top: 18px;
  font-size: 13px; font-weight: 600; letter-spacing: 3px;
  color: var(--acc);
  display: flex; align-items: center; gap: 6px;
}
.card .go svg { width: 15px; height: 15px; transition: transform .2s ease; }
.card:hover .go svg { transform: translateX(3px); }

.card.roulette { --glow: rgba(255,84,150,.5); --line: rgba(255,84,150,.55); --acc: #FF7FB0; --tile: linear-gradient(135deg, rgba(255,84,150,.28), rgba(196,19,232,.22)); }
.card.meet     { --glow: rgba(124,140,255,.5);  --line: rgba(124,140,255,.55); --acc: #9FADFF; --tile: linear-gradient(135deg, rgba(124,140,255,.28), rgba(232,137,12,.18)); }

/* ===== 游戏大卡（宣传图 + 文案横排） ===== */
.card.game {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr);
  align-items: stretch;
  padding: 0;
  --glow: rgba(255,178,84,.5);
  --line: rgba(255,178,84,.6);
  --acc: #FFC860;
}
.card.game .cover { position: relative; overflow: hidden; background: #120c06; }
.card.game .cover img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
.card.game:hover .cover img { transform: scale(1.035); }
.card.game .cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 52%, rgba(20,24,36,.7)); pointer-events: none; }
.card.game .body { padding: 28px; display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 1; }
.card.game .kicker { font-size: 11px; letter-spacing: .22em; font-weight: 700; color: var(--acc); margin-bottom: 9px; }
.card.game h2 { font-size: 24px; }
.card.game .desc { font-size: 14px; line-height: 1.65; max-width: 34em; }
.card.game .go { margin-top: 18px; }

/* ===== 页脚 ===== */
.foot {
  padding: 16px 24px 22px;
  text-align: center;
  font-size: 12px; color: rgba(237,240,247,.38); letter-spacing: 2px;
}

/* ===== 入场动画 ===== */
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.hero { animation: rise .5s ease both; }
.grid { animation: rise .55s ease .12s both; }

/* ===== 移动端 ===== */
@media (max-width: 640px) {
  main { padding: 34px 18px 28px; }
  .hero h1 { font-size: 28px; }
  .hero p { font-size: 13.5px; }
  .grid { grid-template-columns: 1fr; gap: 16px; }
  .card { padding: 22px 20px 20px; }
  .card.game { grid-template-columns: 1fr; }
  .card.game .cover { aspect-ratio: 16 / 9; }
  .card.game .body { padding: 20px; }
  .card.game h2 { font-size: 21px; }
  .card.game .cover::after { background: none; }
}
</style>
</head>
<body>

<header class="top">
  <div class="mark">在野</div>
  <span class="name">在野 · 小工具集</span>
</header>

<main>
  <div class="hero">
    <h1>在野小工具</h1>
    <p>选择一个小工具，开始吧</p>
  </div>

  <!-- ===== 卡片容器：新页面追加 <a class="card ..."> 即可 ===== -->
  <div class="grid">

    <a class="card roulette" href="lunpan.html">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#FF9DC7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 3v4.2M12 16.8V21M3 12h4.2M16.8 12H21M5.6 5.6l3 3M15.4 15.4l3 3M18.4 5.6l-3 3M8.6 15.4l-3 3"/>
        </svg>
      </div>
      <h2>在野轮盘</h2>
      <p class="desc">六区抽奖：抽小组、抽号码，动画飞入结果框，随时重置再来。</p>
      <span class="go">进入工具
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </span>
    </a>

    <a class="card meet" href="xiangyu.html">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#AAB6FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="8" width="6.5" height="4.5" rx="1.5"/>
          <rect x="15" y="8" width="6.5" height="4.5" rx="1.5"/>
          <circle cx="6" cy="15.5" r="1.8"/>
          <circle cx="18" cy="15.5" r="1.8"/>
          <path d="M6.5 6.5h11"/>
        </svg>
      </div>
      <h2>在野相遇</h2>
      <p class="desc">两车相遇模拟：匀变速 / 匀速追及与相向，实时 x-t、v-t 图像联动。</p>
      <span class="go">进入工具
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </span>
    </a>

    <a class="card game" href="rouge.html">
      <div class="cover">
        <img src="assets/rouge-cover.jpg" alt="光头强勇救吉吉公主：熊王地牢主视觉" width="1200" height="675" loading="lazy">
      </div>
      <div class="body">
        <span class="kicker">ROGUELIKE · 地牢闯关</span>
        <h2>光头强勇救吉吉公主</h2>
        <p class="desc">熊王掳走了吉吉公主。抄起电锯杀进五层随机地牢：回旋斩、宝箱、猫头鹰杂货铺，再带着木材回营地永久变强。</p>
        <span class="go">开始闯关
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </span>
      </div>
    </a>

  </div>
</main>

<footer class="foot">在野 · 小工具集</footer>

</body>
</html>
